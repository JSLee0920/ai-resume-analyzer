services:
  postgres:
    image: postgres:17-alpine
    container_name: resumeanalyzer-postgres
    restart: unless-stopped
    ports:
      # 5432 on the host is taken by the native postgresql-x64-18 Windows service
      - "${POSTGRES_PORT:-5433}:5432"
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-ResumeAnalyzerDb}
      POSTGRES_USER: ${POSTGRES_USER:?set POSTGRES_USER in .env}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}
    volumes:
      - postgres-data:/var/lib/postgresql/data
    networks:
      - resumeanalyzer-network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 10s
      timeout: 5s
      retries: 5

  seq:
    image: datalust/seq:latest
    container_name: resumeanalyzer-seq
    restart: unless-stopped
    mem_limit: 512m
    environment:
      ACCEPT_EULA: Y
      SEQ_FIRSTRUN_NOAUTHENTICATION: "true"
    volumes:
      - seq-data:/data
    ports:
      - "5341:5341"
      - "8081:80"
    networks:
      - resumeanalyzer-network

volumes:
  postgres-data:
  seq-data:

networks:
  resumeanalyzer-network:
    driver: bridge
